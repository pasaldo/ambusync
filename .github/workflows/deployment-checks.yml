name: Deployment image checks (manual, no deployment)

# Do not dispatch until minutes/quota/$0 and the push/dispatch are authorized.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.10
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - name: Locked tools and dependencies
        run: |
          python -m pip install uv==0.11.26
          uv sync --directory backend --locked --all-groups
          npm install --global npm@11.19.0
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Real synthetic image smoke (no push or provider credentials)
        run: node ops/deploy/tests/container-contract-test.mjs
