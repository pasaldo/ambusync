[project]
name = "ambusync-backend"
version = "0.1.0"
requires-python = ">=3.14, <3.15"
dependencies = [
    "dj-database-url>=2,<3",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "openapi-spec-validator>=0.9.0",
    "pip-audit>=2.10.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
ignore = ["RUF012"]
